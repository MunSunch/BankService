spring:
  application:
    name: auth
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://localhost:5432/admin
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: create schema if not exists liquibase;
  liquibase:
    default-schema: liquibase
    change-log: classpath:db/changelog/2025/03/06-01-changelog.xml

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8000/eureka/

springdoc:
  api-docs:
    enabled: true
    path: /swagger/api-docs
  swagger-ui:
    enabled: true
    path: /swagger/api-docs-ui

security:
  token:
    type: Bearer
    secret: 
    expire:
      ms: 300000