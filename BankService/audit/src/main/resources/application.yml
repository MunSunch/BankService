spring:
  application:
    name: audit
  data:
    redis:
      host: localhost
      port: 6379
      password: password
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: audit
      bootstrap-servers: localhost:9092
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.type.mapping: com.munsun.deal.integrations.amqp.kafka.payload.AuditActionPayload:com.munsun.audit.integrations.kafka.payload.AuditActionPayload

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8000/eureka/

springdoc:
  api-docs:
    path: /swagger/api-docs
    enabled: true
  swagger-ui:
    path: /swagger/api-docs-ui
    enabled: true

kafka:
  topics:
    audit: audit