services:
  calculator:
    name: calculator
  deal:
    name: deal
  statement:
    name: statement
  dossier:
    name: dossier
  auth:
    name: auth

jwt:
  header: Authorization

spring:
  application:
    name: gateway

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8000/eureka/

springdoc:
  api-docs:
    path: /swagger/api-doc
  swagger-ui:
    path: /swagger/api-docs-ui