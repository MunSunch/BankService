version: '3'
services:
  grafana:
    image: grafana/grafana
    ports:
      - 3000:3000
    volumes:
      - ./grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
          
  prometheus:
    image: prom/prometheus
    ports:
      - 9090:9090
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus:/prometheus

  gateway-mc:
    image: munirsunchalyaev/gateway:2.1.1
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-mc:8000/eureka/
    ports:
      - 8080:8080
      - 8081:8081
    depends_on:
      - auth-mc
      - discovery-mc

  audit-mc:
    image: munirsunchalyaev/audit:0.0.1
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-mc:8000/eureka/
      SPRING_DATA_REDIS_HOST: redis-audit-db
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - discovery-mc
      - redis-audit-db

  redis-audit-db:
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf

  discovery-mc:
    image: munirsunchalyaev/discovery:0.0.1
    ports:
      - 8000:8000
      
  calculator-mc:
    image: munirsunchalyaev/calculator:1.1.3
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-mc:8000/eureka/
    depends_on:
      - discovery-mc

  statement-mc:
    image: munirsunchalyaev/statement:1.1.1
    environment:
      CLIENTS_DEAL_NAME: deal
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-mc:8000/eureka/
    depends_on:
      - deal-mc
      - discovery-mc

  dossier-mc:
    image: munirsunchalyaev/dossier:0.1.4
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-mc:8000/eureka/
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAPSERVERS: kafka:29092
      CLIENTS_DEAL_NAME: deal
      SPRING_MAIL_HOST: host
      SPRING_MAIL_PORT: 777
      SPRING_MAIL_USERNAME: username
      SPRING_MAIL_PASSWORD: password
    depends_on:
      - init-kafka
      - discovery-mc
      
  deal-mc:
    image: munirsunchalyaev/deal:1.2.0
    environment:
      CLIENTS_CALCULATOR_NAME: calculator
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-deal-db/deal_db
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_BOOTSTRAPSERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-mc:8000/eureka/
    depends_on:
      - postgres-deal-db
      - init-kafka
      - discovery-mc

  auth-mc:
    image: munirsunchalyaev/auth:0.0.2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth-db/admin
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-mc:8000/eureka/
      SECURITY_TOKEN_EXPIRE_MS: 3000000
    depends_on:
      - postgres-auth-db
      - discovery-mc

  postgres-auth-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin

  postgres-deal-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: deal_db

  zookeeper:
    image: confluentinc/cp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - 2181:2181

  kafka:
    image: confluentinc/cp-kafka
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  init-kafka:
    image: confluentinc/cp-kafka
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --list

      echo -e 'Creating kafka topics'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic finish-registration --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic create-documents --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic send-documents --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic send-ses --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic credit-issued --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic statement-denied --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic audit --replication-factor 1 --partitions 1

      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "